name: Build
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build
    runs-on: windows-latest
    env:
      # Exposed at job level so steps can gate on its presence via `if: env.SONAR_TOKEN != ''`.
      # (The `secrets` context is not available directly in `if:` conditions.)
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history required by SonarCloud for blame / new-code detection
    - name: Set Up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'
    - name: Install dependencies
      run: dotnet restore

    # --- Required gate: build + test must pass regardless of SonarCloud availability ---
    - name: Build
      run: dotnet build --configuration Debug --no-restore
    - name: Test
      run: dotnet test --no-restore --verbosity normal --logger trx --collect:"XPlat Code Coverage" --settings ./test/coverlet.runsettings

    # --- SonarCloud analysis: optional. Runs only when SONAR_TOKEN is present and never fails
    #     the job (continue-on-error), so an expired/rejected token cannot block a green build. ---
    - name: Cache SonarCloud packages
      if: env.SONAR_TOKEN != ''
      uses: actions/cache@v4
      with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
    - name: Cache SonarCloud scanner
      id: cache-sonar-scanner
      if: env.SONAR_TOKEN != ''
      uses: actions/cache@v4
      with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
    - name: Install SonarCloud scanner
      if: env.SONAR_TOKEN != '' && steps.cache-sonar-scanner.outputs.cache-hit != 'true'
      shell: powershell
      run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner
    - name: SonarCloud analyze
      if: env.SONAR_TOKEN != ''
      continue-on-error: true  # analysis is advisory; credential/infra issues must not fail the build
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      shell: powershell
      run: |
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"unified" /o:"testasm" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx"
          dotnet build --configuration Debug --no-restore
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
